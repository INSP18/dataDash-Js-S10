<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dataDash</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <span>dataDash</span>
        <input type="text" placeholder="Recherche une ville..." id="input">
        <button id="search-btn">Rechercher</button>
    </header>
    <main>
        <section id="main">
            <h2 id="name"></h2>
            <p id="date"></p>
            <h1 id="degree"></h1>
            <h3 id="description"></h3>
            <p id="ressenti"></p>
            <div class="sunriseSunset">
                <div class="icon">
                    <img src="/images/sunrise.png" alt="sunrise" width="30" height="30">
                    <p id="sunrise"></p>
                </div>
                <div class="icon">
                    <img src="/images/sunset.png" alt="sunset" width="30" height="30">
                    <p id="sunset"></p>
                </div>
            </div>
        </section>
        <section id="articles">
            <article id="humidity" class="img"></article>
            <article id="vent"></article>
            <article id="pression"></article>
            <article id="visibility"></article>
        </section>
    </main>
    <footer></footer>

    <script src="/Js/main.js"></script>
</body>
</html>
